[project]
name = "residues"
version = "1.0.0"
description = "Рекомендации к заказу по остаткам и продажам"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"