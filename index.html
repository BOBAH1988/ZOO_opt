<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <!-- Адаптивный viewport: безопасная зона для iPhone (вырезы/остров), зум разрешён для доступности -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
  <!-- Тема применяется до первой отрисовки, чтобы при обновлении страницы не было «вспышки» светлой темы -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'dark' || stored === 'light') theme = stored;
      } catch (e) {
        /* localStorage недоступен — используем светлую тему */
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!-- Единый макет иконки: щит в щите с лапой животного (public/icon.svg) -->
  <link rel="icon" href="/ZOO_opt/favicon.svg?v=3" type="image/svg+xml" sizes="any" />
  <link rel="icon" href="/ZOO_opt/favicon.ico?v=3" sizes="any" />
  <link rel="icon" href="/ZOO_opt/favicon-16.png?v=3" type="image/png" sizes="16x16" />
  <link rel="icon" href="/ZOO_opt/favicon-32.png?v=3" type="image/png" sizes="32x32" />
  <link rel="icon" href="/ZOO_opt/favicon-48.png?v=3" type="image/png" sizes="48x48" />
  <!-- Крупная иконка для вкладки браузера (ретина / высокое разрешение) -->
  <link rel="icon" href="/ZOO_opt/icon-192.png?v=3" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/ZOO_opt/apple-touch-icon.png?v=3" sizes="180x180" />
  <link rel="manifest" href="/ZOO_opt/manifest.json?v=3" />
  <!-- PWA / iOS: режим на весь экран, стиль строки состояния, название на главном экране -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ЗооКонтроль" />
  <meta name="theme-color" content="#0F2A43" />
  <meta name="description" content="ЗооКонтроль — клиенты, отчёты, KPI, автоматизация" />
  <title>ЗооКонтроль</title>
  <!-- Стили стартовой заставки: работают ещё до загрузки основного CSS/JS -->
  <style>
    :root {
      --boot-bg: #f7f9fb;
      --boot-text: #1f2937;
      --boot-muted: #6b7280;
      --boot-primary: #4a7c94;
      --boot-track: rgba(74, 124, 148, 0.18);
      --boot-glow: rgba(74, 124, 148, 0.22);
    }

    html[data-theme="dark"] {
      --boot-bg: #0f172a;
      --boot-text: #e5e7eb;
      --boot-muted: #9ca3af;
      --boot-primary: #38bdf8;
      --boot-track: rgba(56, 189, 248, 0.2);
      --boot-glow: rgba(56, 189, 248, 0.2);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--boot-bg);
    }

    .boot-splash {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(120% 80% at 50% 0%, var(--boot-glow), transparent 62%),
        radial-gradient(90% 60% at 50% 100%, var(--boot-glow), transparent 66%),
        var(--boot-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .boot-splash__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .boot-splash__logo {
      position: relative;
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin-bottom: 4px;
    }

    .boot-splash__logo::before {
      content: '';
      position: absolute;
      inset: -26px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--boot-glow) 0%, transparent 68%);
      animation: boot-pulse 2.6s ease-in-out infinite;
    }

    .boot-splash__icon {
      position: relative;
      z-index: 1;
      width: 84px;
      height: 84px;
      border-radius: 22px;
      background: #0f2a43;
      box-shadow: 0 12px 28px rgba(15, 42, 67, 0.28);
    }

    .boot-splash__ring {
      position: absolute;
      inset: -13px;
      z-index: 2;
      border-radius: 50%;
      border: 3px solid var(--boot-track);
      border-top-color: var(--boot-primary);
      border-right-color: var(--boot-primary);
      animation: boot-spin 0.95s linear infinite;
    }

    .boot-splash__title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--boot-text);
    }

    .boot-splash__bar {
      position: relative;
      width: 148px;
      height: 4px;
      border-radius: 999px;
      background: var(--boot-track);
      overflow: hidden;
    }

    .boot-splash__bar>span {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--boot-primary));
      animation: boot-slide 1.35s ease-in-out infinite;
    }

    .boot-splash__status {
      display: inline-flex;
      align-items: baseline;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--boot-muted);
    }

    .boot-splash__dots {
      display: inline-flex;
    }

    .boot-splash__dots i {
      font-style: normal;
      animation: boot-dot 1.3s ease-in-out infinite;
    }

    .boot-splash__dots i:nth-child(2) {
      animation-delay: 0.16s;
    }

    .boot-splash__dots i:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes boot-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes boot-slide {
      0% {
        left: -45%;
      }

      100% {
        left: 100%;
      }
    }

    @keyframes boot-pulse {

      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.94);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    @keyframes boot-dot {

      0%,
      80%,
      100% {
        opacity: 0.25;
      }

      40% {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .boot-splash__logo::before,
      .boot-splash__ring,
      .boot-splash__bar>span,
      .boot-splash__dots i {
        animation: none;
      }

      .boot-splash__bar>span {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <noscript>
    Для работы приложения необходим JavaScript. Пожалуйста, включите его в настройках браузера.
  </noscript>
  <div id="root">
    <!-- Стартовая заставка: видна до монтирования React, затем заменяется приложением -->
    <div class="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash__content">
        <div class="boot-splash__logo">
          <span class="boot-splash__ring" aria-hidden="true"></span>
          <img class="boot-splash__icon" src="%BASE_URL%icon.svg?v=3" alt="" width="84" height="84" />
        </div>
        <div class="boot-splash__title">ЗооКонтроль</div>
        <div class="boot-splash__bar" aria-hidden="true"><span></span></div>
        <div class="boot-splash__status">
          Загрузка<span class="boot-splash__dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
