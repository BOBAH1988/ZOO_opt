<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Перенаправление…</title>
</head>
<body>
  <script>
    // SPA fallback для GitHub Pages с HashRouter.
    //
    // База вычисляется от адреса страницы, а не вписана числом: при смене
    // имени репозитория или развёртывании в корне домена редирект продолжает
    // работать. Глубина пути — один сегмент (/<репозиторий>/<маршрут>), как у
    // GitHub Pages project site.
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      // Первый сегмент — имя проекта на Pages; остальное — маршрут SPA.
      var repo = parts.length > 0 ? parts[0] + '/' : '';
      var rest = parts.slice(1).join('/');
      var target = window.location.origin + '/' + repo + 'index.html';
      if (rest) {
        target += '#/' + rest;
      }
      window.location.replace(target);
    })();
  </script>
</body>
</html>
