name: "KPI Продажи"

concurrency:
  group: zoo-opt-mail
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      owner_uid:
        description: 'Email владельца, под которым сохранять отчёт в Firestore'
        type: string
        required: false
        default: ''
      test_mode:
        description: 'Тестовый режим (всё уйдёт только вам, не клиентам). По умолчанию выключен'
        type: boolean
        default: false
  run-kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r mail-automation/requirements.txt

      - name: Check secrets format
        working-directory: mail-automation/scripts
        env:
          MAILRU_LOGIN: ${{ secrets.MAILRU_LOGIN }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
        run: python check_secrets.py

      - name: Run pipeline (KPI sales)
        working-directory: mail-automation/scripts
        env:
          MAILRU_LOGIN: ${{ secrets.MAILRU_LOGIN }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OWNER_UID: ${{ github.event.inputs.owner_uid || '' }}
        run: python run_all.py --only kpi
