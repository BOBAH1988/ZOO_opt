name: "Проверка счетов"

concurrency:
  group: zoo-opt-mail
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Какой проект запустить (clients, payments или clients,payments — пусто = оба)"
        type: string
        required: false
        default: "clients,payments"
      test_mode:
        description: "Не используется: сценарий всегда работает в тестовом режиме (письма только вам)"
        type: boolean
        default: true

jobs:
  run-invoices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r mail-automation/requirements.txt

      - name: Check secrets format
        working-directory: mail-automation/scripts
        env:
          MAILRU_LOGIN: ${{ secrets.MAILRU_LOGIN }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
        run: python check_secrets.py

      - name: "Run pipeline (Проект 9: счета клиентам)"
        if: ${{ contains(github.event.inputs.project, 'clients') }}
        working-directory: mail-automation/scripts
        env:
          MAILRU_LOGIN: ${{ secrets.MAILRU_LOGIN }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TEST_MODE: 'true'
        run: python run_all.py --only clients

      - name: "Run pipeline (Проект 11: платёжки клиентов)"
        if: ${{ contains(github.event.inputs.project, 'payments') }}
        working-directory: mail-automation/scripts
        env:
          MAILRU_LOGIN: ${{ secrets.MAILRU_LOGIN }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TEST_MODE: 'true'
        run: python run_all.py --only payments
