name: "Обновить отчёт о продажах за 3 мес."

concurrency:
  group: zoo-opt-mail
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  update-sales-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r mail-automation/requirements.txt

      - name: Update sales report
        working-directory: mail-automation/scripts
        env:
          MAILRU_LOGIN: ${{ secrets.MAILRU_LOGIN }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
        run: python update_sales_report.py

      - name: Commit updated sales report
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "mail-automation/project residues/Весь ассортимент за 3 мес.xlsx"
          git commit -m "chore: обновить отчёт о продажах за 3 мес." || echo "Нет изменений для коммита"
          git push
