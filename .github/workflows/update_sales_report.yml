name: "Обновить отчёт о продажах за 3 мес."

concurrency:
  group: zoo-opt-mail
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sales-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r mail-automation/requirements.txt

      - name: Update sales report
        working-directory: mail-automation/scripts
        env:
          MAILRU_LOGIN: ${{ secrets.MAILRU_LOGIN }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
        run: python update_sales_report.py

      - name: Commit updated sales report
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REPORT_PATH="mail-automation/project residues/Весь ассортимент за 3 мес.xlsx"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Файл отчёта не создан — коммит пропущен"
            exit 0
          fi
          # Ensure directory exists in git (add .gitkeep if needed)
          git add "$REPORT_PATH"
          git commit -m "chore: обновить отчёт о продажах за 3 мес." || echo "Нет изменений для коммита"
          git push
