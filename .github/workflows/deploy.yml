name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint

      - name: Load and validate Firebase configuration
        env:
          ZOO_CONFIG: ${{ secrets.ZOO }}
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { loadEnv } from 'vite';

          const raw = process.env.ZOO_CONFIG;
          if (!raw) {
            console.error('::error::Missing GitHub Actions secret ZOO');
            process.exit(1);
          }

          let envText = raw;
          try {
            const config = JSON.parse(raw);
            if (config && typeof config === 'object' && !Array.isArray(config)) {
              envText = Object.entries(config)
                .map(([key, value]) => `${key}=${String(value)}`)
                .join('\n');
            }
          } catch (error) {
            if (!(error instanceof SyntaxError)) throw error;
          }

          writeFileSync('.env', envText, { mode: 0o600 });

          const config = loadEnv('production', process.cwd(), 'VITE_');
          const required = [
            'VITE_FIREBASE_API_KEY',
            'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_APP_ID',
          ];
          const missing = required.filter((key) => !config[key]);
          if (missing.length) {
            console.error(`::error::Secret ZOO is missing required Firebase settings: ${missing.join(', ')}`);
            process.exit(1);
          }

          if (!/^AIza[0-9A-Za-z_-]{30,}$/.test(config.VITE_FIREBASE_API_KEY)) {
            console.error('::error::VITE_FIREBASE_API_KEY is not a valid Firebase Web API key. Copy the actual apiKey from Firebase Console; do not use an example placeholder.');
            process.exit(1);
          }
          NODE

      - name: Build PWA
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_DISABLE_SIGNUP: ${{ secrets.VITE_DISABLE_SIGNUP }}
          VITE_ALLOWED_EMAILS: ${{ secrets.VITE_ALLOWED_EMAILS }}
          VITE_ALLOWED_EMAIL_DOMAINS: ${{ secrets.VITE_ALLOWED_EMAIL_DOMAINS }}
          VITE_REGISTRATION_INVITE_CODE: ${{ secrets.VITE_REGISTRATION_INVITE_CODE }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
